<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BANZAI VEGAS — cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 720px;
    background: #150a33;
    background-image:
      radial-gradient(1200px 800px at 80% -10%, #4c1d95 0%, transparent 60%),
      radial-gradient(1000px 700px at 0% 20%, #701a75 0%, transparent 55%),
      radial-gradient(900px 900px at 50% 110%, #1e3a8a 0%, transparent 60%),
      linear-gradient(180deg, #150a33 0%, #1e0f45 50%, #12081f 100%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .glow {
    position: absolute; left: 50%; top: 240px; transform: translateX(-50%);
    width: 900px; height: 200px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 180, 0, 0.28) 0%, rgba(255, 0, 128, 0.12) 55%, transparent 75%);
    filter: blur(8px);
  }
  .eyebrow { letter-spacing: 10px; font-size: 22px; color: #d946ef; font-weight: bold; margin-bottom: 18px; }
  h1 {
    font-size: 118px; line-height: 1; letter-spacing: 4px; font-weight: 900;
    background: linear-gradient(180deg, #fff8d6 0%, #ffd700 38%, #b8860b 55%, #ffe95c 72%, #8a6400 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 42px rgba(255, 200, 0, 0.35);
  }
  h1 .vegas { color: transparent; }
  .sub { margin-top: 16px; font-size: 30px; letter-spacing: 6px; color: #c4b5fd; font-weight: bold; }
  .ticket {
    margin-top: 34px; padding: 14px 28px; border: 2px dashed #ffd700; border-radius: 12px;
    background: rgba(255, 215, 0, 0.08); font-size: 24px; letter-spacing: 3px; color: #ffe95c;
  }
  .prizes { display: flex; gap: 22px; margin-top: 30px; }
  .chip {
    min-width: 170px; text-align: center; padding: 12px 18px; border-radius: 10px;
    background: #150a33; border: 1px solid #7c3aed;
  }
  .chip b { display: block; font-size: 15px; letter-spacing: 3px; color: #d946ef; }
  .chip span { font-size: 26px; font-weight: 900; color: #ffd700; }
  .foot { position: absolute; bottom: 26px; font-size: 19px; letter-spacing: 4px; color: #c4b5fd; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="eyebrow">ON-CHAIN RAFFLE</div>
  <h1>BANZAI VEGAS</h1>
  <div class="sub">WIN THE POT · 5 QOR A TICKET</div>
  <div class="ticket">🎰 &nbsp;DRAWS EVERY DAY — 20:00 UTC&nbsp; 🎰</div>
  <div class="prizes">
    <div class="chip"><b>1ST</b><span>30%</span></div>
    <div class="chip"><b>2ND</b><span>18%</span></div>
    <div class="chip"><b>3RD</b><span>12%</span></div>
    <div class="chip"><b>LUCKY LOTS</b><span>29 × 100</span></div>
  </div>
  <div class="foot">QORECHAIN TESTNET · POST-QUANTUM DAPP</div>
</body>
</html>
